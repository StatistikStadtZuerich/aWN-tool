include:
  # use template for all stages 
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: v1.1.12
    file: "stages.yml"
  # use template for gitlab pipeline to deploy to shinyapps.io
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: v1.1.12
    file: "deploy-to-shinyapps.yml"
  # use template for gitlab pipeline to push main to github 
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: v1.1.12
    file: "publish-to-github.yml"
  # use template to build package
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: v1.1.12
    file: "r-check-and-build-packages.yml"

variables:
  #PKG_CACHE_DIR: "${CI_PROJECT_DIR}/renv/cache"
  #PKG_PACKAGE_CACHE_DIR: "$CI_PROJECT_DIR/.cache/R/pkgcache/pkg"
  PKG_SYSREQS: "false"
  R_USER_CACHE_DIR: "$CI_PROJECT_DIR/.cache"
  #R_PKG_CACHE_DIR: "$CI_PROJECT_DIR/.cache/R/pkgcache/pkg"

.before-script-with-abseil:
  before_script:
    - echo "$KERBEROS_KEYTAB_SSZ_UPIPELINE_PROXY"
    # curl & Kerberos Tools installieren
    - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl krb5-user libabsl-dev cmake

    # Base64-Keytab aus GitLab Variable in Datei decodieren
    # Wichtig: KERBEROS_KEYTAB_SSZ_UPIPELINE_PROXY muss in GitLab CI/CD Settings existieren
    - echo "$KERBEROS_KEYTAB_SSZ_UPIPELINE_PROXY" | base64 -d > "$KRB5_KTNAME"
    - chmod 600 "$KRB5_KTNAME"

    # Kerberos-Login über Keytab
    - kinit -k -t "$KRB5_KTNAME" "$KRB5_PRINCIPAL"
    - klist  # Kontrolle: Ticket vorhanden?
    - Rscript -e 'print(Sys.getenv(c("R_USER_CACHE_DIR", "R_PKG_CACHE_DIR", "HOME", "PKG_PACKAGE_CACHE_DIR")))'
    - Rscript -e "renv::restore(packages = 'pak')"
    - Rscript -e "pak::cache_summary()"
    - Rscript -e ".libPaths()"
    - Rscript -e "renv::restore()"

# run tests with nice report (view output in GitLab Pipeline > Tests)
r-testthat-test:
  extends: .r-testthat-test
  before_script:
    - !reference [.before-script-with-abseil, before_script]
  cache:
    - key: apt-cache-test
      paths:
        - .apt-cache/
    - key: ${CI_PROJECT_NAME}
      paths:
        - ${RENV_PATHS_CACHE}
        - ".cache/R/"

# run cmd check without tests (tests already exist in r-testthat-test)
r-devtools-check:
  extends: .r-devtools-check
  before_script:
    - !reference [.before-script-with-abseil, before_script]
  script:
    - Rscript -e "renv::status()"
    - Rscript -e "devtools::check(args = '--no-tests', error_on = 'error')"
  cache:
    - key: apt-cache-check
      paths:
        - .apt-cache/
    - key: ${CI_PROJECT_NAME}
      paths:
        - ${RENV_PATHS_CACHE}
        - ".cache/R/"

shiny-deploy-int:
  extends:
    - .shiny-deploy-int
    - .before-script-with-abseil
  before_script:
    - !reference [.before-script-with-abseil, before_script]
  script:
    # run different file than specified in default deploy job
    - Rscript -e "source('dev/run_in_pipeline.R')"

shiny-deploy-prod:
  extends:
    - .shiny-deploy-prod 
    - .before-script-with-abseil
  before_script:
    - !reference [.before-script-with-abseil, before_script]
  rules: 
    # keep inherited rules
    - !reference [.shiny-deploy-prod , rules]
    # add additional rule to run on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    # run different file than specified in default deploy job
    - Rscript -e "source('dev/run_in_pipeline.R')"

publish-main-to-github:
  extends:
    - .publish-main-to-github
